<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyper Media Production</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --white: #ffffff;
    --white-90: rgba(255,255,255,0.9);
    --white-60: rgba(255,255,255,0.6);
    --white-30: rgba(255,255,255,0.3);
    --white-10: rgba(255,255,255,0.1);
    --white-05: rgba(255,255,255,0.05);
    --bg: #000000;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 48px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    backdrop-filter: blur(2px);
  }
  .nav-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    color: var(--white-90);
  }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a {
    font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--white-60); text-decoration: none;
    transition: color 0.3s;
  }
  .nav-links a:hover { color: var(--white); }

  /* ── HERO ── */
  #hero {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* particle canvas sits behind everything */
  #particleCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }

  /* centered content */
  .hero-content {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; gap: 32px;
    opacity: 0;
    animation: fadeUp 1.8s 0.8s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .company-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 8vw, 7rem);
    letter-spacing: 0.12em;
    line-height: 0.9;
    text-align: center;
    color: var(--white);
    text-shadow:
      0 0 80px rgba(255,255,255,0.15),
      0 0 120px rgba(255,255,255,0.08);
  }
  .company-name .line2 {
    color: var(--white-60);
    font-size: clamp(2rem, 5vw, 4.5rem);
    letter-spacing: 0.25em;
    display: block;
    margin-top: 6px;
  }

  .tagline {
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--white-40);
    text-align: center;
  }

  .cta-row { display: flex; gap: 16px; margin-top: 8px; }
  .btn {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.65rem; letter-spacing: 0.22em; text-transform: uppercase;
    padding: 14px 36px; border-radius: 2px; cursor: pointer;
    transition: all 0.3s; text-decoration: none;
  }
  .btn-primary {
    background: var(--white); color: #000;
    border: 1px solid var(--white);
  }
  .btn-primary:hover { background: transparent; color: var(--white); }
  .btn-ghost {
    background: transparent; color: var(--white-70);
    border: 1px solid var(--white-30);
  }
  .btn-ghost:hover { border-color: var(--white); color: var(--white); }

  /* scroll hint */
  .scroll-hint {
    position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    color: var(--white-30); font-size: 0.6rem; letter-spacing: 0.2em;
    text-transform: uppercase; z-index: 10;
    animation: bounce 2s infinite;
  }
  .scroll-hint span { width: 1px; height: 40px; background: var(--white-20); }
  @keyframes bounce {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(6px); }
  }

  /* ── SECTIONS ── */
  section {
    padding: 120px 80px;
    border-top: 1px solid var(--white-10);
  }
  .section-label {
    font-size: 0.65rem; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--white-30); margin-bottom: 24px;
  }
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 5vw, 5rem);
    letter-spacing: 0.08em;
    color: var(--white-90);
    line-height: 1;
    margin-bottom: 40px;
  }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1px;
    background: var(--white-10);
    border: 1px solid var(--white-10);
  }
  .service-card {
    background: var(--bg);
    padding: 48px 32px;
    transition: background 0.3s;
  }
  .service-card:hover { background: var(--white-05); }
  .service-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem; color: var(--white-10);
    display: block; margin-bottom: 16px;
  }
  .service-name {
    font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--white-80); margin-bottom: 12px;
  }
  .service-desc {
    font-size: 0.75rem; line-height: 1.8;
    color: var(--white-40);
  }

  footer {
    padding: 48px 80px;
    border-top: 1px solid var(--white-10);
    display: flex; justify-content: space-between; align-items: center;
  }
  .footer-copy {
    font-size: 0.65rem; letter-spacing: 0.15em;
    color: var(--white-30);
  }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">HMP</div>
  
  </div>
</nav>

<!-- HERO -->
<section id="hero">
  <canvas id="particleCanvas"></canvas>

  

  <div class="scroll-hint">
    Scroll
    <span></span>
  </div>
</section>

<footer>
  <div class="footer-copy">© 2026 Hyper Media Production. All rights reserved.</div>
  <div class="footer-copy">Kathmandu · Nepal</div>
</footer>

<script>
// ── PARTICLE / STIPPLE EFFECT ──────────────────────────────────────────────
const canvas = document.getElementById('particleCanvas');
const ctx    = canvas.getContext('2d');

let W, H, particles = [], mouse = { x: -9999, y: -9999 };
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); initParticles(); });
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

// ── Draw the logo + text into an offscreen canvas, sample dots from it ──
function buildSampler() {
  const off = document.createElement('canvas');
  const oW = Math.min(W, 1200), oH = Math.min(H, 900);
  off.width = oW; off.height = oH;
  const oc = off.getContext('2d');

  // Background black
  oc.fillStyle = '#000';
  oc.fillRect(0, 0, oW, oH);

  // Draw the rocket SVG as a large bright shape
  const cx = oW / 2, cy = oH * 0.30;

  // Body glow — rotated 45° clockwise around rocket centre
  oc.save();
  oc.translate(cx, cy);
  oc.rotate(Math.PI / 4); // 45° clockwise
  oc.translate(-cx, -cy);
  oc.shadowColor = 'white';
  oc.shadowBlur  = 40;

  // Rocket body path
  oc.beginPath();
  const scale = oW * 0.22;
  oc.moveTo(cx, cy - scale * 0.75);
  oc.bezierCurveTo(cx - scale * 0.5, cy - scale * 0.1,
                   cx - scale * 0.55, cy + scale * 0.6,
                   cx, cy + scale * 0.8);
  oc.bezierCurveTo(cx + scale * 0.55, cy + scale * 0.6,
                   cx + scale * 0.5,  cy - scale * 0.1,
                   cx, cy - scale * 0.75);
  oc.fillStyle = 'rgba(255,255,255,0.85)';
  oc.fill();

  // Porthole
  oc.beginPath();
  oc.arc(cx, cy + scale * 0.05, scale * 0.18, 0, Math.PI * 2);
  oc.fillStyle = 'rgba(0,0,0,0.6)';
  oc.fill();
  oc.strokeStyle = 'rgba(255,255,255,0.7)';
  oc.lineWidth = scale * 0.04;
  oc.stroke();

  // Left fin
  oc.beginPath();
  oc.moveTo(cx - scale * 0.55, cy + scale * 0.6);
  oc.lineTo(cx - scale * 0.9,  cy + scale * 1.0);
  oc.lineTo(cx - scale * 0.2,  cy + scale * 0.75);
  oc.closePath();
  oc.fillStyle = 'rgba(255,255,255,0.55)';
  oc.fill();

  // Right fin
  oc.beginPath();
  oc.moveTo(cx + scale * 0.55, cy + scale * 0.6);
  oc.lineTo(cx + scale * 0.9,  cy + scale * 1.0);
  oc.lineTo(cx + scale * 0.2,  cy + scale * 0.75);
  oc.closePath();
  oc.fillStyle = 'rgba(255,255,255,0.55)';
  oc.fill();

  oc.restore();

  // Text below
  const textY = cy + scale * 1.6;
  oc.fillStyle = 'rgba(255,255,255,0.9)';
  oc.font = `bold ${oW * 0.1}px 'Bebas Neue', serif`;
  oc.textAlign = 'center';
  oc.fillText('HYPER', cx, textY);

  oc.fillStyle = 'rgba(255,255,255,0.75)';
  oc.font = `${oW * 0.06}px 'Bebas Neue', serif`;
  oc.fillText('MEDIA PRODUCTION', cx, textY + oW * 0.065);

  return { off, oW, oH };
}

// ── Sample bright pixels and spawn particles there ──
function initParticles() {
  particles = [];
  const { off, oW, oH } = buildSampler();
  const oc = off.getContext('2d');

  const imgData = oc.getImageData(0, 0, oW, oH).data;
  const offsetX = (W - oW) / 2;
  const offsetY = (H - oH) / 2;

  const step = 4; // sample every N pixels
  for (let y = 0; y < oH; y += step) {
    for (let x = 0; x < oW; x += step) {
      const i = (y * oW + x) * 4;
      const brightness = (imgData[i] + imgData[i+1] + imgData[i+2]) / 3;
      if (brightness > 30 && Math.random() < brightness / 255) {
        const tx = x + offsetX;
        const ty = y + offsetY;
        particles.push({
          x:  tx + (Math.random() - 0.5) * W * 0.6,
          y:  ty + (Math.random() - 0.5) * H * 0.5,
          tx, ty,
          size: Math.random() * 1.6 + 0.3,
          alpha: (brightness / 255) * (Math.random() * 0.5 + 0.3),
          speed: Math.random() * 0.035 + 0.012,
          twinkle: Math.random() * Math.PI * 2,
          twinkleSpeed: Math.random() * 0.04 + 0.01,
        });
      }
    }
  }
}

// ── Animate ──
let frame = 0;
function animate() {
  requestAnimationFrame(animate);
  ctx.clearRect(0, 0, W, H);
  frame++;

  for (const p of particles) {
    // drift toward target
    p.x += (p.tx - p.x) * p.speed;
    p.y += (p.ty - p.y) * p.speed;

    // subtle mouse repulsion
    const dx = p.x - mouse.x, dy = p.y - mouse.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 120) {
      const force = (120 - dist) / 120 * 1.2;
      p.x += (dx / dist) * force;
      p.y += (dy / dist) * force;
    }

    // twinkle
    p.twinkle += p.twinkleSpeed;
    const tw = (Math.sin(p.twinkle) * 0.35 + 0.65);

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${p.alpha * tw})`;
    ctx.fill();
  }
}

// Wait for fonts then build
document.fonts.ready.then(() => {
  initParticles();
  animate();
});
</script>
</body>
</html>
