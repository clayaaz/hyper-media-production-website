<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyper Media Production</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --white: #ffffff;
    --white-90: rgba(255,255,255,0.9);
    --white-60: rgba(255,255,255,0.6);
    --white-30: rgba(255,255,255,0.3);
    --white-10: rgba(255,255,255,0.1);
    --white-05: rgba(255,255,255,0.05);
    --bg: #000000;
  }
  html, body { width:100%; height:100%; background:var(--bg); color:var(--white); font-family:'Montserrat',sans-serif; overflow-x:hidden; }
  nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:24px 48px; background:linear-gradient(to bottom,rgba(0,0,0,0.7),transparent); backdrop-filter:blur(2px); }
  .nav-logo { font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:0.3em; color:var(--white-90); }
  .nav-links { display:flex; gap:32px; }
  .nav-links a { font-size:0.7rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--white-60); text-decoration:none; transition:color 0.3s; }
  .nav-links a:hover { color:var(--white); }
  #hero { position:relative; width:100vw; height:100vh; overflow:hidden; }
  #particleCanvas { position:absolute; inset:0; width:100%; height:100%; }
  .scroll-hint { position:absolute; bottom:36px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--white-30); font-size:0.6rem; letter-spacing:0.2em; text-transform:uppercase; z-index:10; animation:bounce 2s infinite; }
  .scroll-hint span { width:1px; height:40px; background:rgba(255,255,255,0.2); }
  @keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(6px);} }
  section { padding:120px 80px; border-top:1px solid var(--white-10); }
  .section-label { font-size:0.65rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--white-30); margin-bottom:24px; }
  .section-title { font-family:'Bebas Neue',sans-serif; font-size:clamp(2.5rem,5vw,5rem); letter-spacing:0.08em; color:var(--white-90); line-height:1; margin-bottom:40px; }
  .services-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1px; background:var(--white-10); border:1px solid var(--white-10); }
  .service-card { background:var(--bg); padding:48px 32px; transition:background 0.3s; }
  .service-card:hover { background:var(--white-05); }
  .service-num { font-family:'Bebas Neue',sans-serif; font-size:3rem; color:var(--white-10); display:block; margin-bottom:16px; }
  .service-name { font-size:0.85rem; letter-spacing:0.15em; text-transform:uppercase; color:rgba(255,255,255,0.8); margin-bottom:12px; }
  .service-desc { font-size:0.75rem; line-height:1.8; color:rgba(255,255,255,0.4); }

  /* ── OUR WORK SECTION ── */
  #our-work {
    padding: 100px 80px 140px;
    border-top: 1px solid var(--white-10);
    position: relative;
    overflow: hidden;
  }

  #our-work .section-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 72px;
    gap: 40px;
  }
  #our-work .section-header-left { flex: 1; }
  #our-work .section-tagline {
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    line-height: 1.9;
    color: var(--white-30);
    max-width: 340px;
    text-align: right;
    font-weight: 300;
  }

  /* ── 3D CAROUSEL ── */
  .carousel-scene {
    position: relative;
    width: 100%;
    perspective: 1600px;
    perspective-origin: 50% 40%;
  }

  .carousel-track {
    position: relative;
    width: 100%;
    height: clamp(280px, 48vw, 640px);
    transform-style: preserve-3d;
  }

  .carousel-slide {
    position: absolute;
    top: 0;
    left: 50%;
    width: min(82vw, 920px);
    transform: translateX(-50%);
    transform-style: preserve-3d;
    transition: transform 0.78s cubic-bezier(.16,1,.3,1),
                opacity  0.78s cubic-bezier(.16,1,.3,1),
                filter   0.78s cubic-bezier(.16,1,.3,1);
    will-change: transform, opacity;
  }

  .carousel-slide.is-active  { opacity:1; filter:brightness(1);   z-index:3; pointer-events:auto; }
  .carousel-slide.is-next    { opacity:0.35; filter:brightness(0.45) blur(1px); z-index:2; pointer-events:none; }
  .carousel-slide.is-prev    { opacity:0.35; filter:brightness(0.45) blur(1px); z-index:2; pointer-events:none; }
  .carousel-slide.is-hidden  { opacity:0; pointer-events:none; z-index:1; }

  .slide-inner {
    position: relative;
    width: 100%;
    border: 1px solid var(--white-10);
    background: #000;
    overflow: visible;
  }

  .bracket {
    position: absolute;
    width: 18px;
    height: 18px;
    z-index: 4;
    pointer-events: none;
  }
  .bracket--tl { top:-1px; left:-1px; border-top:1px solid var(--white-60); border-left:1px solid var(--white-60); }
  .bracket--tr { top:-1px; right:-1px; border-top:1px solid var(--white-60); border-right:1px solid var(--white-60); }
  .bracket--bl { bottom:-1px; left:-1px; border-bottom:1px solid var(--white-60); border-left:1px solid var(--white-60); }
  .bracket--br { bottom:-1px; right:-1px; border-bottom:1px solid var(--white-60); border-right:1px solid var(--white-60); }

  .video-ratio {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    overflow: hidden;
  }
  .video-ratio iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .slide-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 16px;
    margin-top: 14px;
    border-top: 1px solid var(--white-10);
  }
  .slide-meta-label {
    font-size: 0.62rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--white-30);
  }
  .slide-meta-index {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    color: var(--white-10);
  }

  /* ── ARROW ── */
  .carousel-arrow {
    position: absolute;
    right: -20px;
    top: 44%;
    transform: translateY(-50%);
    width: 54px;
    height: 54px;
    border: 1px solid var(--white-30);
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    transition: border-color 0.3s, background 0.3s, transform 0.3s;
    outline: none;
  }
  .carousel-arrow:hover {
    border-color: var(--white-90);
    background: var(--white-05);
    transform: translateY(-50%) scale(1.1);
  }
  .carousel-arrow:active { transform: translateY(-50%) scale(0.95); }
  .carousel-arrow svg {
    width: 18px; height: 18px;
    stroke: var(--white-60);
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.3s;
  }
  .carousel-arrow:hover svg { stroke: var(--white); }

  /* Pulse ring on arrow */
  .carousel-arrow::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid var(--white-10);
    animation: ring-pulse 2.4s ease-in-out infinite;
  }
  @keyframes ring-pulse {
    0%,100% { opacity:0.4; transform:scale(1); }
    50%      { opacity:0; transform:scale(1.25); }
  }

  /* ── DOTS ── */
  .carousel-dots {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 36px;
  }
  .dot {
    width: 28px;
    height: 1px;
    background: var(--white-30);
    cursor: pointer;
    transition: background 0.4s, width 0.4s;
    position: relative;
  }
  .dot.active {
    width: 52px;
    background: var(--white-90);
  }

  /* Fade-in on scroll */
  .reveal {
    opacity: 0;
    transform: translateY(32px);
    transition: opacity 0.9s cubic-bezier(.16,1,.3,1), transform 0.9s cubic-bezier(.16,1,.3,1);
  }
  .reveal.visible { opacity:1; transform:translateY(0); }

  footer { padding:48px 80px; border-top:1px solid var(--white-10); display:flex; justify-content:space-between; align-items:center; }
  .footer-copy { font-size:0.65rem; letter-spacing:0.15em; color:var(--white-30); }
</style>
</head>
<body>
<nav>
  <div class="nav-logo">HMP</div>
</nav>
<section id="hero">
  <canvas id="particleCanvas"></canvas>
  <div class="scroll-hint">Scroll<span></span></div>
</section>

<!-- ── OUR WORK ── -->
<section id="our-work">
  <div class="section-header reveal">
    <div class="section-header-left">
      <p class="section-label">Selected Work</p>
      <h2 class="section-title">Our Work</h2>
    </div>
    <p class="section-tagline">
      Visual stories crafted<br>
      with intention — where<br>
      every frame matters.
    </p>
  </div>

  <div class="carousel-scene reveal" style="transition-delay:0.15s;">
    <div class="carousel-track" id="carouselTrack">

      <!-- Slide 1 -->
      <div class="carousel-slide is-active" data-index="0">
        <div class="slide-inner">
          <span class="bracket bracket--tl"></span>
          <span class="bracket bracket--tr"></span>
          <span class="bracket bracket--bl"></span>
          <span class="bracket bracket--br"></span>
          <div class="video-ratio">
            <iframe
              src="https://www.youtube.com/embed/fZUiIV88fLI?rel=0&modestbranding=1&color=white"
              title="HMP — Showreel 2026"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
            ></iframe>
          </div>
        </div>
        <div class="slide-meta">
          <span class="slide-meta-label">Hyper Media Production &nbsp;/&nbsp; Featured</span>
          <span class="slide-meta-index">01 — 2026</span>
        </div>
      </div>

      <!-- Slide 2 -->
      <div class="carousel-slide is-next" data-index="1">
        <div class="slide-inner">
          <span class="bracket bracket--tl"></span>
          <span class="bracket bracket--tr"></span>
          <span class="bracket bracket--bl"></span>
          <span class="bracket bracket--br"></span>
          <div class="video-ratio">
            <iframe
              src="https://www.youtube.com/embed/9rpo5zksXpM?rel=0&modestbranding=1&color=white"
              title="HMP — Feature 2026"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
            ></iframe>
          </div>
        </div>
        <div class="slide-meta">
          <span class="slide-meta-label">Hyper Media Production &nbsp;/&nbsp; Showreel</span>
          <span class="slide-meta-index">02 — 2026</span>
        </div>
      </div>

    </div><!-- /track -->

    <!-- Right arrow -->
    <button class="carousel-arrow" id="carouselNext" aria-label="Next video">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>

    <!-- Dots -->
    <div class="carousel-dots" id="carouselDots">
      <div class="dot active" data-goto="0"></div>
      <div class="dot"        data-goto="1"></div>
    </div>
  </div>
</section>

<footer>
  <div class="footer-copy">© 2026 Hyper Media Production. All rights reserved.</div>
  <div class="footer-copy">Kathmandu · Nepal</div>
</footer>

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); initStars(); initParticles(); });
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

// The real logo embedded as base64

function buildSampler() {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const off = document.createElement('canvas');
      const oW = Math.min(W, 1400), oH = Math.min(H, 900);
      off.width = oW; off.height = oH;
      const oc = off.getContext('2d');

      // Black background
      oc.fillStyle = '#000';
      oc.fillRect(0, 0, oW, oH);

      // Draw logo centred in upper portion, large
      const logoSize = Math.min(oW, oH) * 0.72;
      const lx = (oW - logoSize) / 2;
      const ly = oH * 0.06;
      oc.drawImage(img, lx, ly, logoSize, logoSize);
      
      const textY = (ly + logoSize + oW * 0.13) - 125;

      const padding = oW * 0.03;
      let fontSize = oW * 0.18;

      oc.textAlign = 'center';
      oc.fillStyle = 'rgba(255,255,255,1)';

      do {
        oc.font = `${fontSize}px 'Bebas Neue', serif`;
        var textWidth = oc.measureText('HYPER MEDIA PRODUCTION').width;
        fontSize -= 2;
      } while (textWidth > (oW - padding * 2));

      oc.fillText('HYPER MEDIA PRODUCTION', oW / 2, textY);

      resolve({ off, oW, oH });
    };
    img.src = LOGO_B64;
  });
}

async function initParticles() {
  particles = [];
  const { off, oW, oH } = await buildSampler();
  const oc = off.getContext('2d');
  const imgData = oc.getImageData(0, 0, oW, oH).data;
  const offsetX = (W - oW) / 2;
  const offsetY = (H - oH) / 2;

  const step = 3;
  for (let y = 0; y < oH; y += step) {
    for (let x = 0; x < oW; x += step) {
      const i = (y * oW + x) * 4;
      const brightness = (imgData[i] + imgData[i+1] + imgData[i+2]) / 3;
      if (brightness > 20 && Math.random() < brightness / 255) {
        const tx = x + offsetX;
        const ty = y + offsetY;
        particles.push({
          x:  tx + (Math.random() - 0.5) * W * 0.8,
          y:  ty + (Math.random() - 0.5) * H * 0.6,
          tx, ty,
          size: Math.random() * 1.8 + 0.2,
          alpha: (brightness / 255) * (Math.random() * 0.5 + 0.3),
          speed: Math.random() * 0.03 + 0.01,
          twinkle: Math.random() * Math.PI * 2,
          twinkleSpeed: Math.random() * 0.04 + 0.01,
        });
      }
    }
  }
  if (!animating && heroVisible) { animating = true; animate(); }
}

let animating = false;
let heroVisible = true;
let starLayers = [];

// Pause the canvas loop when the hero scrolls fully out of view
const heroObserver = new IntersectionObserver(entries => {
  heroVisible = entries[0].isIntersecting;
  if (heroVisible && !animating) { animating = true; animate(); }
}, { threshold: 0 });
heroObserver.observe(document.getElementById('hero'));

function initStars() {
  starLayers = [];
  const layerConfigs = [
    { density: 3200, size: [0.2, 0.8], alpha: [0.05, 0.25] },
    { density: 3000, size: [0.4, 1.2], alpha: [0.1, 0.5] },
    { density: 3000, size: [0.6, 1.8], alpha: [0.2, 0.9] }
  ];
  for (const layer of layerConfigs) {
    const stars = [];
    const count = Math.floor((W * H) / layer.density);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 0.12 + 0.03;
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        size: Math.random() * (layer.size[1] - layer.size[0]) + layer.size[0],
        alpha: Math.random() * (layer.alpha[1] - layer.alpha[0]) + layer.alpha[0],
        twinkle: Math.random() * Math.PI * 2,
        twinkleSpeed: Math.random() * 0.02 + 0.005
      });
    }
    starLayers.push(stars);
  }
}

function animate() {
  if (!heroVisible) { animating = false; return; }
  requestAnimationFrame(animate);
  ctx.clearRect(0, 0, W, H);
  for (const layer of starLayers) {
    for (const s of layer) {
      s.x += s.vx; s.y += s.vy;
      s.vx += (Math.random() - 0.5) * 0.0015;
      s.vy += (Math.random() - 0.5) * 0.0015;
      s.vx *= 0.995; s.vy *= 0.995;
      if (s.x < 0) s.x = W; if (s.x > W) s.x = 0;
      if (s.y < 0) s.y = H; if (s.y > H) s.y = 0;
      s.twinkle += s.twinkleSpeed;
      const pulse = Math.sin(s.twinkle) * 0.5 + 0.5;
      const size = s.size * (0.6 + pulse * 0.8);
      const alpha = s.alpha * (0.4 + pulse * 1.2);
      ctx.beginPath();
      ctx.arc(s.x, s.y, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fill();
    }
  }
  for (const p of particles) {
    p.x += (p.tx - p.x) * p.speed * 5;
    p.y += (p.ty - p.y) * p.speed * 5;
    const dx = p.x - mouse.x, dy = p.y - mouse.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 130) {
      const force = (130 - dist) / 130 * 1.5;
      p.x += (dx / dist) * force;
      p.y += (dy / dist) * force;
    }
    p.twinkle += p.twinkleSpeed * 2;
    const tw = Math.sin(p.twinkle) * 0.35 + 0.65;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${p.alpha * tw})`;
    ctx.fill();
  }
}

document.fonts.ready.then(() => { initStars(); initParticles(); });

// ── 3D CAROUSEL ──
(function () {
  const slides  = Array.from(document.querySelectorAll('.carousel-slide'));
  const dots    = Array.from(document.querySelectorAll('.carousel-dots .dot'));
  const nextBtn = document.getElementById('carouselNext');
  const total   = slides.length;
  let   current = 0;
  let   busy    = false;

  // 3-D layout constants
  const ACTIVE_Z   =   0;
  const SIDE_Z     = -260;
  const SIDE_X     =  62;   // % shift left/right for side cards
  const SIDE_SCALE =  0.82;
  const SIDE_ROT_Y =  22;   // degrees

  function getState(i, cur, tot) {
    const diff = ((i - cur) % tot + tot) % tot;
    if (diff === 0)         return 'is-active';
    if (diff === 1)         return 'is-next';
    if (diff === tot - 1)   return 'is-prev';
    return 'is-hidden';
  }

  function applyTransforms(cur) {
    slides.forEach((sl, i) => {
      const state = getState(i, cur, total);
      sl.className = 'carousel-slide ' + state;

      if (state === 'is-active') {
        sl.style.transform = `translateX(-50%) translateZ(${ACTIVE_Z}px) rotateY(0deg) scale(1)`;
      } else if (state === 'is-next') {
        sl.style.transform = `translateX(calc(-50% + ${SIDE_X}%)) translateZ(${SIDE_Z}px) rotateY(-${SIDE_ROT_Y}deg) scale(${SIDE_SCALE})`;
      } else if (state === 'is-prev') {
        sl.style.transform = `translateX(calc(-50% - ${SIDE_X}%)) translateZ(${SIDE_Z}px) rotateY(${SIDE_ROT_Y}deg) scale(${SIDE_SCALE})`;
      } else {
        sl.style.transform = `translateX(-50%) translateZ(${SIDE_Z - 80}px) scale(0.7)`;
      }
    });

    dots.forEach((d, i) => d.classList.toggle('active', i === cur));

    // flip arrow direction when on last slide (wraps back to first)
    const isLast = cur === total - 1;
    nextBtn.querySelector('svg polyline').setAttribute(
      'points', isLast ? '15 18 9 12 15 6' : '9 18 15 12 9 6'
    );
  }

  function goTo(idx) {
    if (busy) return;
    busy = true;
    current = ((idx % total) + total) % total;
    applyTransforms(current);
    setTimeout(() => { busy = false; }, 820);
  }

  nextBtn.addEventListener('click', () => goTo(current + 1));
  dots.forEach(d => d.addEventListener('click', () => goTo(+d.dataset.goto)));

  // Keyboard support
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') goTo(current + 1);
    if (e.key === 'ArrowLeft')  goTo(current - 1);
  });

  // Initial layout
  applyTransforms(0);
})();
</script>
